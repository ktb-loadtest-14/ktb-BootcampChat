name: Backend CI

on:
  # test 또는 main 대상 PR에서 백엔드 변경이 있을 때만 빌드와 테스트를 수행한다.
  pull_request:
    branches:
      - test
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  # test 또는 main 브랜치 push에서 검증한 뒤 이미지를 GHCR에 업로드한다.
  push:
    branches:
      - test
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  # 같은 브랜치/PR의 이전 실행을 취소하고 가장 최근 커밋만 검증한다.
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # PR과 test/main 브랜치 push에서 공통으로 실행되는 검증 단계다.
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Build and run tests
        run: ./mvnw -B clean verify

  publish-image:
    # PR에서는 실행하지 않고 test/main 브랜치 push에서만 이미지를 업로드한다.
    name: Build and push image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # test/stable은 각 브랜치의 최신 이미지, sha는 배포·롤백용 고정 태그다.
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # 백엔드는 독립된 Maven 프로젝트이므로 해당 디렉터리만 context로 사용한다.
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
