name: Frontend CI

on:
  # GitHub Actions의 Run workflow 버튼으로 검증과 이미지 발행을 수동 실행한다.
  workflow_dispatch:
  # test 또는 main 대상 PR에서 프론트 변경이 있을 때만 빌드와 테스트를 수행한다.
  pull_request:
    branches:
      - test
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
  # test 또는 main 브랜치 push에서 검증한 뒤 이미지를 GHCR에 업로드한다.
  push:
    branches:
      - test
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  # 같은 브랜치/PR의 이전 실행을 취소하고 가장 최근 커밋만 검증한다.
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # PR과 test/main 브랜치 push에서 공통으로 실행되는 검증 단계다.
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Run tests
        run: pnpm --dir apps/frontend test

      - name: Validate frontend build variables
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || { echo "::error::NEXT_PUBLIC_API_URL variable is required"; exit 1; }
          test -n "$NEXT_PUBLIC_SOCKET_URL" || { echo "::error::NEXT_PUBLIC_SOCKET_URL variable is required"; exit 1; }

      - name: Build application
        # NEXT_PUBLIC_* 값은 Next.js 빌드 시점에 브라우저 코드에 포함된다.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
        run: pnpm --dir apps/frontend build

  publish-image:
    # PR에서는 실행하지 않고 test/main 브랜치 push에서만 이미지를 업로드한다.
    name: Build and push image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # test/stable은 각 브랜치의 최신 이미지, sha는 배포·롤백용 고정 태그다.
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # 프론트 Dockerfile은 pnpm workspace 파일을 사용하므로 저장소 루트가 context다.
          context: .
          file: apps/frontend/Dockerfile
          push: true
          # test/main 이미지에 같은 Repository Variables를 빌드 인자로 전달한다.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
