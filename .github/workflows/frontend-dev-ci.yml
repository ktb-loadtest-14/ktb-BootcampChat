name: Frontend Dev CI

on:
  # dev 브랜치에 프론트 관련 변경이 push된 경우에만 검증한다.
  push:
    branches:
      - dev
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-dev-ci.yml"

concurrency:
  # dev에 push가 연속으로 들어오면 가장 최근 커밋만 검증한다.
  group: frontend-dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Run tests
        run: pnpm --dir apps/frontend test

      - name: Validate frontend build variables
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || { echo "::error::NEXT_PUBLIC_API_URL variable is required"; exit 1; }
          test -n "$NEXT_PUBLIC_SOCKET_URL" || { echo "::error::NEXT_PUBLIC_SOCKET_URL variable is required"; exit 1; }

      - name: Build application
        # NEXT_PUBLIC_* 값은 Next.js 빌드 시점에 브라우저 코드에 포함된다.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
        run: pnpm --dir apps/frontend build
